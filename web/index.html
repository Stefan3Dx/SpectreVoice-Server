<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a14">
<title>Spectre Voice</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="dm.css">
<link rel="stylesheet" href="sound.css">
<link rel="stylesheet" href="chat.css">
<link rel="icon" href="data:,">
<link rel="modulepreload" href="core.js">
<link rel="modulepreload" href="i18n.js">
</head>
<body data-rtc="new" data-pane="channels">

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 108 108" aria-hidden="true"><path fill="currentColor" d="M33,48 a3,3 0 0 1 6,0 v12 a3,3 0 0 1 -6,0 z M43,38 a3,3 0 0 1 6,0 v32 a3,3 0 0 1 -6,0 z M51,30 a3,3 0 0 1 6,0 v48 a3,3 0 0 1 -6,0 z M59,38 a3,3 0 0 1 6,0 v32 a3,3 0 0 1 -6,0 z M69,48 a3,3 0 0 1 6,0 v12 a3,3 0 0 1 -6,0 z"/></svg>
    <div class="server">Spectre Voice</div>
  </div>
  <div class="tools">
    <button id="settingsPre" class="ghost icon" type="button" data-i18n-title="settings" title="Settings">⚙</button>
  </div>
</header>

<main id="connect" class="card connect">
  <h1 data-i18n="welcome">Join the server</h1>
  <p id="inviteNote" class="muted hidden"></p>
  <form id="form" autocomplete="off">
    <label><span data-i18n="name">Your name</span><input id="name" maxlength="32" required></label>
    <button id="go" class="primary" type="submit" data-i18n="connect">Connect</button>
  </form>
  <p id="connectError" class="error hidden"></p>
  <p class="muted small"><span data-i18n="idNote">Your identity is a key made in this browser; there is no account.</span> <span id="uidNote"></span></p>
</main>

<section id="app" class="app hidden">
  <nav class="mobile-tabs">
    <button type="button" data-pane="channels" class="on" data-i18n="channels">Channels</button>
    <button type="button" data-pane="chat" data-i18n="chat">Chat</button>
    <button type="button" data-pane="stage" data-i18n="liveTab">Live</button>
    <button type="button" data-pane="people" data-i18n="people">People</button>
  </nav>

  <!-- Left: the server and its channels, you at the bottom (the PC's ServerHeader, ChannelTree, UserCard) -->
  <aside id="channels" class="pane channels glass">
    <div class="srvhead">
      <div id="srvIcon" class="srvicon" aria-hidden="true">SV</div>
      <div class="srvtext">
        <div id="serverName" class="server">Spectre Voice</div>
        <div class="srvstatus"><span class="sdot"></span><span id="status" class="status" data-i18n="off">Disconnected</span></div>
      </div>
      <button id="leave" class="iconbtn sm hidden" type="button" data-i18n-title="leave" title="Leave"></button>
    </div>
    <div class="chscroll">
      <div id="commBar" class="commbar hidden"><div id="commName" class="commname"></div></div>
      <div id="motd" class="motd hidden"></div>
      <div id="tvCard" class="tvcard hidden"></div>
      <div id="liveBox" class="livebox hidden">
        <div class="boxhead" data-i18n="liveNow">Live now</div>
        <div id="liveList"></div>
      </div>
      <div id="tree" class="tree"></div>
    </div>
    <div id="userCard" class="usercard">
      <div class="ucrow">
        <span id="meAvatar" class="meav"></span>
        <div class="ucname"><div id="meName" class="mename"></div><div id="meWhere" class="mewhere"></div></div>
      </div>
      <div class="ucrow">
        <span id="voiceDot" class="vdot"></span><span id="voiceText" class="vtext"></span>
        <button id="shareBtn" class="iconbtn share hidden" type="button" data-i18n-title="shareScreen" title="Share screen"></button>
        <button id="mute" class="iconbtn" type="button" data-i18n-title="mute" title="Mute"></button>
        <button id="deafen" class="iconbtn" type="button" data-i18n-title="deafen" title="Deafen"></button>
        <button id="settings" class="iconbtn" type="button" data-i18n-title="settings" title="Settings"></button>
      </div>
      <span id="shareInfo" class="shareinfo hidden"></span>
    </div>
  </aside>

  <!-- Middle: the streams watched, then the chat -->
  <section id="middle" class="pane middle">
    <div id="stage" class="stage glass hidden">
      <div id="tiles" class="tiles"></div>
      <p class="stage-empty muted" data-i18n="stageEmpty">Nobody you watch is live. Pick a stream in the channel list.</p>
    </div>
    <section id="chat" class="chat glass" data-view="chat">
      <div class="chat-head">
        <div class="chat-tabs">
          <button id="tabChannel" type="button" class="on"></button>
          <button id="tabComm" type="button" data-i18n="serverChat">Server</button>
          <button id="tabFiles" type="button" class="hidden" data-i18n="files">Files</button>
        </div>
        <!-- Other modules' tool buttons (soundboard, music, games…): each opens its own dialog -->
        <div id="moduleTools" class="moduletools"></div>
      </div>
      <div id="messages" class="messages">
        <button id="older" class="ghost small hidden" type="button" data-i18n="older">Older messages</button>
        <div id="msgList"></div>
      </div>
      <div id="filesView" class="filesview"></div>
      <div id="typing" class="typing"></div>
      <div id="replyBar" class="replybar hidden"></div>
      <div id="mentions" class="mentions hidden"></div>
      <div id="uploads" class="uploads"></div>
      <form id="sayForm" class="say">
        <button id="attach" class="iconbtn" type="button" data-i18n-title="attach" title="Send a file or picture"></button>
        <input id="attachFile" type="file" class="hidden" multiple>
        <button id="emojiBtn" class="iconbtn" type="button" data-i18n-title="emoji" title="Emoji"></button>
        <input id="say" maxlength="4000" data-i18n-ph="write" placeholder="Write a message…" autocomplete="off">
        <button id="sendBtn" class="iconbtn send" type="submit" data-i18n-title="send" title="Send"></button>
      </form>
    </section>
  </section>

  <!-- Right: who's talking, who's in your channel, your microphone (the PC's RightPanel and MicCard) -->
  <aside id="people" class="pane people">
    <div class="glass peoplebox">
      <div class="section" data-i18n="talkingNow">Talking now</div>
      <div id="talkers" class="talkers"></div>
      <div id="peopleLive" class="peoplelive"></div>
      <div id="hereTitle" class="section"></div>
      <div id="hereList" class="herelist"></div>
    </div>
    <div class="glass miccard">
      <div class="section" data-i18n="yourMic">Your microphone</div>
      <button id="ptt" class="ptt" type="button"><span data-i18n="ptt">Hold to talk</span> <kbd id="pttKey">Space</kbd></button>
      <label class="chk"><input id="openMic" type="checkbox"> <span data-i18n="openMic">Open mic</span></label>
    </div>
  </aside>
</section>

<div id="toast" class="toast hidden" popover="manual" role="status" aria-live="polite"></div>
<div id="volPop" class="volpop hidden"></div>
<dialog id="dlg" class="dlg"></dialog>

<footer class="foot">
  <span data-i18n="footer">The web client. Games and the rest are in the app:</span>
  <a href="https://spectrevoice.com" rel="noopener">spectrevoice.com</a>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
