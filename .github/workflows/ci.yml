name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg (music bot tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg shellcheck
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: shellcheck -S warning install.sh
